databases:
  - name: dpokmm-ps-db
    databaseName: khammam_ps
    user: khammam_ps_user
    plan: free
    region: singapore

services:
  - type: web
    name: dpokmm-ps-portal
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_MULTI_USER_SESSIONS
        value: "true"
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: dpokmm-ps-db
          property: connectionString
